---
- name: Install dependencies
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl

- name: Remove legacy Docker apt source (apt_repository format)
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Install python3-debian (required by deb822_repository)
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add Docker apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_repo_url }}"
    signed_by: "{{ docker_gpg_cert_url }}"
    suites: "{{ ansible_facts['distribution_release'] | lower }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    state: present
    enabled: true
  notify: "Refresh apt cache"

- name: Install Docker packages
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Install Docker packages
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Install docker daemon as rootless
  ansible.builtin.include_tasks:
    file: rootless.yml
  when: "docker_rootless_mode"

- name: Install root docker daemon as root
  ansible.builtin.include_tasks:
    file: root.yml
  when: "not docker_rootless_mode"

- name: Configure daemon options
  become: true
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}"
    dest: "{{ docker_daemon_config_dir }}/daemon.json"
    mode: "0644"
    owner: "{{ docker_rootless_mode | ternary(docker_rootless_user, 'root') }}"
    group: "{{ docker_rootless_mode | ternary(docker_rootless_user, 'root') }}"
  when: "docker_daemon_options | length > 0"
  notify: "restart docker"

- name: Start Docker on boot
  become: true
  become_user: "{{ docker_rootless_mode | ternary(docker_rootless_user, 'root') }}"
  ansible.builtin.systemd_service:
    name: docker
    scope: "{{ docker_rootless_mode | ternary('user', 'system') }}"
    state: started
    enabled: true

- name: Configure a registry credential helper
  ansible.builtin.include_tasks:
    file: pass-credential-helper.yml
  when: "docker_credential_helper_enabled"

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
