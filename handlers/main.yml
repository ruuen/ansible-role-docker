---
- name: Restart docker
  become: "{{ not docker_rootless_mode }}"
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    scope: "{{ docker_rootless_mode | ternary('user', 'system') }}"

- name: Reset ssh
  ansible.builtin.meta: reset_connection

- name: Refresh apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
